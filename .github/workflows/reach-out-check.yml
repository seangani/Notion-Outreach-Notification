name: Notion reach-out check

on:
  schedule:
    # Once a day, weekdays, at 12:07 UTC (~8:07am Eastern). The :07 offset
    # is deliberate — GitHub Actions schedules queue up right at :00, so
    # off-the-hour minutes run closer to on-time. Adjust for daylight
    # saving or your own timezone — cron always runs in UTC.
    - cron: '7 12 * * 1-5'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python check_reach_out.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_VALUES: ${{ vars.TARGET_VALUES }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
