name: Call reminder check

on:
  schedule:
    # Once an hour, every day, at :07 past the hour — not on the hour, to
    # avoid GitHub's top-of-hour scheduling congestion (see
    # reach-out-check.yml for the same reasoning). Hourly is deliberate:
    # the "CALL REMINDER" formula window is ~1 hour wide, so an hourly
    # check will always land inside it once, without needing to poll every
    # few minutes (and risk spamming your phone if something misfires).
    - cron: '7 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python call_reminder_check.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
