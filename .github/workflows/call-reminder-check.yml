name: Call reminder check

on:
  # Triggered on time by the Cloudflare Worker in worker/ (GitHub's own
  # cron runs hours late). See worker/src/index.js.
  repository_dispatch:
    types: [run-call-reminder]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python call_reminder_check.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
